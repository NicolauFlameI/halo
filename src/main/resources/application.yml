spring:
  application:
    name: halo
  datasource:
    url: ${HALO_DB_URL:jdbc:postgresql://localhost:5432/halo}
    username: ${HALO_DB_USER:halo}
    password: ${HALO_DB_PASSWORD:halo}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
