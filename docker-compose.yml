# PostgreSQL local para desenvolvimento do HALO. Subir com: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: halo-postgres
    environment:
      POSTGRES_DB: halo
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: halo
    ports:
      - "5432:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem quando o container é recriado
      - halo-pgdata:/var/lib/postgresql/data

volumes:
  halo-pgdata:
